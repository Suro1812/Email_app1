x-app-image: &app-image
  build: .
  image: email-reminders:latest

services:
  api:
    <<: *app-image
    command: ./scripts/start-api.sh
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://username:password@host.docker.internal:5432/email_reminders}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-email-processing}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-projects/YOUR_PROJECT/topics/gmail-inbox}
      GMAIL_PUBSUB_AUDIENCE: ${GMAIL_PUBSUB_AUDIENCE:-https://YOUR_DOMAIN/webhooks/gmail/pubsub}
      GMAIL_PUBSUB_SERVICE_ACCOUNT: ${GMAIL_PUBSUB_SERVICE_ACCOUNT:-pubsub-push@YOUR_PROJECT.iam.gserviceaccount.com}
      GMAIL_PUBSUB_VERIFY_TOKEN: ${GMAIL_PUBSUB_VERIFY_TOKEN:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis

  worker:
    <<: *app-image
    command: ./scripts/start-worker.sh
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://username:password@host.docker.internal:5432/email_reminders}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-email-processing}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-1800}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-1500}
      EMAIL_MESSAGE_FETCH_CONCURRENCY: ${EMAIL_MESSAGE_FETCH_CONCURRENCY:-5}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-projects/YOUR_PROJECT/topics/gmail-inbox}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_reminders}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-email_reminders}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
