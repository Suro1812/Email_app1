[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-reminders"
version = "0.1.0"
description = "A tool for managing email reminders via Gmail API"
authors = [
    {name = "Surojit Dutta", email = "surojitdutta1812@gmail.com"},
]
dependencies = [
    "fastapi",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-openai",
    "langfuse",
    "mcp",
    "openai",
    "sqlalchemy",
    "sqlmodel",
    "psycopg[binary,pool]",
    "psycopg2-binary",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "beautifulsoup4",
    "icalendar",
    "celery",
    "presidio-analyzer",
    "prometheus-client",
    "redis",
    "uvicorn",
]
requires-python = ">=3.8"
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "flake8",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
